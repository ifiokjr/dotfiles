# Keep the SHA-pinned GitHub Actions in .github/workflows fresh: zizmor and
# tests/security-audit.sh verify pinning, but nothing else proposes updates,
# so stale pins would otherwise persist until manually reviewed.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies
    # Wait 7 days after a release before proposing a bump: brand-new action
    # tags are the supply-chain window where a compromised or yanked release
    # does the most damage, and every bump lands as a reviewable SHA diff.
    cooldown:
      default-days: 7
