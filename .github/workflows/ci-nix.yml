name: ci-nix

on:
  push:
    branches: [main]
    paths:
      - "Configs/nix/**"
      - "Configs/pnpm/**"
      - "Configs/scripts/.local/bin/pnpm:global:sync"
      - "Hooks/nix/**"
      - "Hooks/pnpm/**"
      - "lib/setup/**"
      - "setup"
      - "setup-tuckr-symlink.sh"
      - "Dockerfile"
      - "tests/**"
      - ".github/workflows/ci-nix.yml"
  pull_request:
    branches: [main]
    paths:
      - "Configs/nix/**"
      - "Configs/pnpm/**"
      - "Configs/scripts/.local/bin/pnpm:global:sync"
      - "Hooks/nix/**"
      - "Hooks/pnpm/**"
      - "lib/setup/**"
      - "setup"
      - "setup-tuckr-symlink.sh"
      - "Dockerfile"
      - "tests/**"
      - ".github/workflows/ci-nix.yml"

permissions:
  contents: read

concurrency:
  group: ci-nix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: detect changed areas
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run_setup: ${{ steps.filter.outputs.setup }}
      run_macos: ${{ steps.filter.outputs.macos }}
      run_docker: ${{ steps.filter.outputs.docker }}
      run_remote_installer: ${{ steps.filter.outputs.remote_installer }}
    steps:
      - name: 📥 checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔍 detect file changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            setup:
              - "Configs/nix/**"
              - "Configs/pnpm/**"
              - "Configs/scripts/.local/bin/pnpm:global:sync"
              - "Hooks/nix/**"
              - "Hooks/pnpm/**"
              - "lib/setup/**"
              - "setup"
              - "setup-tuckr-symlink.sh"
              - ".github/workflows/ci-nix.yml"
            remote_installer:
              - "Configs/nix/**"
              - "Configs/pnpm/**"
              - "Configs/scripts/.local/bin/pnpm:global:sync"
              - "Hooks/nix/**"
              - "Hooks/pnpm/**"
              - "lib/setup/**"
              - "setup"
              - "setup-tuckr-symlink.sh"
              - "tests/remote-installer-smoke.sh"
              - ".github/workflows/ci-nix.yml"
            macos:
              - "Configs/nix/.config/nix/darwin.nix"
              - "Configs/nix/.config/nix/flake.nix"
              - "Configs/nix/.config/nix/home.nix"
              - "Configs/pnpm/**"
              - "Configs/scripts/.local/bin/pnpm:global:sync"
              - "Hooks/nix/**"
              - "Hooks/pnpm/**"
              - "lib/setup/**"
              - "setup"
              - "setup-tuckr-symlink.sh"
              - ".github/workflows/ci-nix.yml"
            docker:
              - "Configs/pnpm/**"
              - "Configs/scripts/.local/bin/pnpm:global:sync"
              - "Hooks/pnpm/**"
              - "Dockerfile"
              - "tests/**"
              - "lib/setup/**"
              - "setup"
              - "setup-tuckr-symlink.sh"
              - ".github/workflows/ci-nix.yml"

  remote-installer-smoke:
    needs: changes
    if: needs.changes.outputs.run_remote_installer == 'true'
    name: remote installer smoke test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 📥 checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔧 install nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🧪 run remote installer smoke test
        run: tests/remote-installer-smoke.sh "$GITHUB_WORKSPACE"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  setup-ubuntu:
    needs: changes
    if: needs.changes.outputs.run_setup == 'true'
    name: setup script (ubuntu-latest)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 📥 checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔧 install nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🧪 run setup script
        # The Docker integration test runs the full Linux setup (including the
        # nix group's home-manager rebuild). This job validates the setup script
        # and group deployment without spending an hour on cold Nix builds.
        run: ./setup --skip-nix --no-confirm --lite --groups scripts,bash,direnv,dprint,shell,zellij,zsh,nushell,helix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: ✅ verify setup completed
        run: |
          test -L "$HOME/.config/nushell/config.nu"
          test -L "$HOME/.config/helix/config.toml"
          test -L "$HOME/.zshrc"

  setup-macos:
    needs: changes
    if: needs.changes.outputs.run_setup == 'true' && needs.changes.outputs.run_macos == 'true'
    name: setup script (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: 📥 checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🧹 free disk space (macos)
        run: |
          # Remove Xcode to free ~12GB (nix provides its own build tools)
          sudo rm -rf /Applications/Xcode_*.app
          # Remove simulators
          xcrun simctl delete all 2>/dev/null || true
          sudo rm -rf ~/Library/Developer/CoreSimulator
          df -h /

      - name: 🔧 install nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🧪 run setup script (minimal, no nix rebuild)
        run: ./setup --skip-nix --no-confirm --lite --groups scripts,bash,direnv,dprint,shell,zellij,zsh,nushell,helix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: ✅ verify setup completed
        run: |
          command -v tuckr && echo "tuckr: ok"
          command -v nu && echo "nushell: ok"
          tuckr status || true
          test -L "$HOME/.config/nushell/config.nu"
          test -L "$HOME/.config/helix/config.toml"
          test -L "$HOME/.zshrc"

  docker-integration:
    needs: changes
    if: needs.changes.outputs.run_docker == 'true'
    name: docker integration test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 📥 checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔧 set up docker buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: 🏗️ build docker integration image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: dotfiles-test:latest
          # The fast path skips the 1-2 hour home-manager rebuild; full
          # rebuilds remain covered by local `docker build` and the fleet.
          build-args: DOTFILES_CI_FAST=1
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}

      - name: 🧪 run docker integration test
        run: docker run --rm dotfiles-test:latest
