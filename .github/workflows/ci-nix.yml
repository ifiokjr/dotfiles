name: ci-nix

on:
  push:
    branches: [main]
    paths:
      - "Configs/nix/**"
      - "Configs/pnpm/**"
      - "Configs/scripts/.local/bin/pnpm:global:sync"
      - "Hooks/nix/**"
      - "Hooks/pnpm/**"
      - "lib/setup/**"
      - "setup"
      - "setup-tuckr-symlink.sh"
      - "Dockerfile"
      - "tests/**"
      - ".github/workflows/ci-nix.yml"
  pull_request:
    branches: [main]
    paths:
      - "Configs/nix/**"
      - "Configs/pnpm/**"
      - "Configs/scripts/.local/bin/pnpm:global:sync"
      - "Hooks/nix/**"
      - "Hooks/pnpm/**"
      - "lib/setup/**"
      - "setup"
      - "setup-tuckr-symlink.sh"
      - "Dockerfile"
      - "tests/**"
      - ".github/workflows/ci-nix.yml"

permissions:
  contents: read

concurrency:
  group: ci-nix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: detect changed areas
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run_setup: ${{ steps.filter.outputs.setup }}
      run_macos: ${{ steps.filter.outputs.macos }}
      run_docker: ${{ steps.filter.outputs.docker }}
      run_remote_installer: ${{ steps.filter.outputs.remote_installer }}
    steps:
      - name: 📥 checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: 🔍 detect file changes
        id: filter
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          filters: |
            setup:
              - "Configs/nix/**"
              - "Configs/pnpm/**"
              - "Configs/scripts/.local/bin/pnpm:global:sync"
              - "Hooks/nix/**"
              - "Hooks/pnpm/**"
              - "lib/setup/**"
              - "setup"
              - "setup-tuckr-symlink.sh"
              - ".github/workflows/ci-nix.yml"
            remote_installer:
              - "Configs/nix/**"
              - "Configs/pnpm/**"
              - "Configs/scripts/.local/bin/pnpm:global:sync"
              - "Hooks/nix/**"
              - "Hooks/pnpm/**"
              - "lib/setup/**"
              - "setup"
              - "setup-tuckr-symlink.sh"
              - "tests/remote-installer-smoke.sh"
              - ".github/workflows/ci-nix.yml"
            macos:
              - "Configs/nix/.config/nix/darwin.nix"
              - "Configs/nix/.config/nix/flake.nix"
              - "Configs/nix/.config/nix/home.nix"
              - "Configs/pnpm/**"
              - "Configs/scripts/.local/bin/pnpm:global:sync"
              - "Hooks/nix/**"
              - "Hooks/pnpm/**"
              - "lib/setup/**"
              - "setup"
              - "setup-tuckr-symlink.sh"
              - ".github/workflows/ci-nix.yml"
            docker:
              - "Configs/pnpm/**"
              - "Configs/scripts/.local/bin/pnpm:global:sync"
              - "Hooks/pnpm/**"
              - "Dockerfile"
              - "tests/**"
              - "lib/setup/**"
              - "setup"
              - "setup-tuckr-symlink.sh"
              - ".github/workflows/ci-nix.yml"

  remote-installer-smoke:
    needs: changes
    if: needs.changes.outputs.run_remote_installer == 'true'
    name: remote installer smoke test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 📥 checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: 🔧 install nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔧 set up nix cache
        uses: DeterminateSystems/flakehub-cache-action@main
        with:
          token: ${{ secrets.FLAKEHUB_API_TOKEN }}
        continue-on-error: true

      - name: 🧪 run remote installer smoke test
        run: tests/remote-installer-smoke.sh "$GITHUB_WORKSPACE"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  setup-ubuntu:
    needs: changes
    if: needs.changes.outputs.run_setup == 'true'
    name: setup script (ubuntu-latest)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 📥 checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: 🔧 install nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔧 set up nix cache
        uses: DeterminateSystems/flakehub-cache-action@main
        with:
          token: ${{ secrets.FLAKEHUB_API_TOKEN }}
        continue-on-error: true

      - name: 🧪 run setup script
        run: ./setup --skip-nix --no-confirm --lite
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: ✅ verify setup completed
        run: |
          command -v tuckr && echo "tuckr: ok"
          command -v nu && echo "nushell: ok"
          tuckr status || true
          test -L "$HOME/.config/nushell/config.nu"
          test -L "$HOME/.config/helix/config.toml"
          test -L "$HOME/.zshrc"

  setup-macos:
    needs: changes
    if: needs.changes.outputs.run_setup == 'true' && needs.changes.outputs.run_macos == 'true'
    name: setup script (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: 📥 checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: 🧹 free disk space (macos)
        run: |
          # Remove Xcode to free ~12GB (nix provides its own build tools)
          sudo rm -rf /Applications/Xcode_*.app
          # Remove simulators
          xcrun simctl delete all 2>/dev/null || true
          sudo rm -rf ~/Library/Developer/CoreSimulator
          df -h /

      - name: 🔧 install nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔧 set up nix cache
        uses: DeterminateSystems/flakehub-cache-action@main
        with:
          token: ${{ secrets.FLAKEHUB_API_TOKEN }}
        continue-on-error: true

      - name: 🧪 run setup script (minimal, no nix rebuild)
        run: ./setup --skip-nix --no-confirm --lite --groups scripts,bash,direnv,dprint,shell,zellij,zsh,nushell,helix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: ✅ verify setup completed
        run: |
          command -v tuckr && echo "tuckr: ok"
          command -v nu && echo "nushell: ok"
          tuckr status || true
          test -L "$HOME/.config/nushell/config.nu"
          test -L "$HOME/.config/helix/config.toml"
          test -L "$HOME/.zshrc"

  docker-integration:
    needs: changes
    if: needs.changes.outputs.run_docker == 'true'
    name: docker integration test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 📥 checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: 🏗️ build and run docker integration test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: DOCKER_BUILDKIT=1 docker build --secret id=github_token,env=GITHUB_TOKEN -t dotfiles-test .
