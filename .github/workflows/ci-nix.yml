name: ci-nix

on:
  push:
    branches: [main]
    paths:
      - "Configs/nix/**"
      - "Configs/pnpm/**"
      - "Configs/scripts/.local/bin/pnpm:global:sync"
      - "Hooks/nix/**"
      - "Hooks/pnpm/**"
      - "setup"
      - "setup-tuckr-symlink.sh"
      - "Dockerfile"
      - "tests/**"
      - ".github/workflows/ci-nix.yml"
  pull_request:
    branches: [main]
    paths:
      - "Configs/nix/**"
      - "Configs/pnpm/**"
      - "Configs/scripts/.local/bin/pnpm:global:sync"
      - "Hooks/nix/**"
      - "Hooks/pnpm/**"
      - "setup"
      - "setup-tuckr-symlink.sh"
      - "Dockerfile"
      - "tests/**"
      - ".github/workflows/ci-nix.yml"

concurrency:
  group: ci-nix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: detect changed areas
    runs-on: ubuntu-latest
    outputs:
      run_setup: ${{ steps.filter.outputs.setup }}
      run_macos: ${{ steps.filter.outputs.macos }}
      run_docker: ${{ steps.filter.outputs.docker }}
    steps:
      - name: 📥 checkout repository
        uses: actions/checkout@v4

      - name: 🔍 detect file changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            setup:
              - "Configs/nix/**"
              - "Configs/pnpm/**"
              - "Configs/scripts/.local/bin/pnpm:global:sync"
              - "Hooks/nix/**"
              - "Hooks/pnpm/**"
              - "setup"
              - "setup-tuckr-symlink.sh"
              - ".github/workflows/ci-nix.yml"
            macos:
              - "Configs/nix/.config/nix/darwin.nix"
              - "Configs/nix/.config/nix/flake.nix"
              - "Configs/nix/.config/nix/home.nix"
              - "Configs/pnpm/**"
              - "Configs/scripts/.local/bin/pnpm:global:sync"
              - "Hooks/nix/**"
              - "Hooks/pnpm/**"
              - "setup"
              - "setup-tuckr-symlink.sh"
              - ".github/workflows/ci-nix.yml"
            docker:
              - "Configs/pnpm/**"
              - "Configs/scripts/.local/bin/pnpm:global:sync"
              - "Hooks/pnpm/**"
              - "Dockerfile"
              - "tests/**"
              - "setup"
              - "setup-tuckr-symlink.sh"
              - ".github/workflows/ci-nix.yml"

  setup-ubuntu:
    needs: changes
    if: needs.changes.outputs.run_setup == 'true'
    name: setup script (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 checkout repository
        uses: actions/checkout@v4

      - name: 🔧 install nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔧 set up nix cache
        uses: DeterminateSystems/magic-nix-cache-action@main
        continue-on-error: true

      - name: 🧪 run setup script
        run: ./setup --skip-nix --no-confirm --lite
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: ✅ verify setup completed
        run: |
          command -v tuckr && echo "tuckr: ok"
          command -v nu && echo "nushell: ok"
          tuckr status || true
          test -L "$HOME/.config/nushell/config.nu"
          test -L "$HOME/.config/helix/config.toml"
          test -L "$HOME/.zshrc"

  setup-macos:
    needs: changes
    if: needs.changes.outputs.run_setup == 'true' && needs.changes.outputs.run_macos == 'true'
    name: setup script (macos-latest)
    runs-on: macos-latest
    steps:
      - name: 📥 checkout repository
        uses: actions/checkout@v4

      - name: 🧹 free disk space & remove pre-installed Homebrew (macos)
        run: |
          # Remove Xcode to free ~12GB (nix provides its own build tools)
          sudo rm -rf /Applications/Xcode_*.app
          # Remove simulators
          xcrun simctl delete all 2>/dev/null || true
          sudo rm -rf ~/Library/Developer/CoreSimulator
          # Completely remove pre-installed Homebrew so nix-homebrew can
          # install and manage it declaratively from scratch.
          sudo rm -rf /opt/homebrew/*
          sudo rm -rf /opt/homebrew/.??*
          df -h /

      - name: 🔧 install nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔧 set up nix cache
        uses: DeterminateSystems/magic-nix-cache-action@main
        continue-on-error: true

      - name: 🧪 run setup script
        run: ./setup --skip-nix --no-confirm --lite
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: ✅ verify setup completed
        run: |
          command -v tuckr && echo "tuckr: ok"
          command -v nu && echo "nushell: ok"
          tuckr status || true
          test -L "$HOME/.config/nushell/config.nu"
          test -L "$HOME/.config/helix/config.toml"
          test -L "$HOME/.zshrc"

  docker-integration:
    needs: changes
    if: needs.changes.outputs.run_docker == 'true'
    name: docker integration test
    runs-on: ubuntu-latest
    steps:
      - name: 📥 checkout repository
        uses: actions/checkout@v4

      - name: 🏗️ build and run docker integration test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: DOCKER_BUILDKIT=1 docker build --secret id=github_token,env=GITHUB_TOKEN -t dotfiles-test .
