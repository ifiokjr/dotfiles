name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-format:
    name: lint & format (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: 📥 checkout repository
        uses: actions/checkout@v4

      - name: 🔧 install nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: 📦 install tools
        run: |
          nix profile add nixpkgs#nushell
          nix profile add nixpkgs#shellcheck
          nix profile add nixpkgs#shfmt
          nix profile add nixpkgs#dprint
          nix profile add nixpkgs#nufmt
          nix profile add nixpkgs#nixfmt
          nix profile add nixpkgs#kdlfmt

      - name: 🔧 set up formatter configs
        run: |
          # kdlfmt needs its config at ~/.config/kdl/kdlfmt.kdl
          mkdir -p ~/.config/kdl
          cp Configs/kdl/.config/kdl/kdlfmt.kdl ~/.config/kdl/kdlfmt.kdl

      - name: 🔍 shellcheck bash scripts
        run: |
          shellcheck setup setup-tuckr-symlink.sh Hooks/*

      - name: 🔍 validate nushell scripts (nu-check)
        run: |
          # Check .nu module files
          for f in $(find . -name '*.nu' -not -path './.git/*'); do
            echo "Checking: $f"
            nu -c "nu-check --as-module '$f'"
          done

          # Check nushell scripts without .nu extension (have #!/usr/bin/env nu shebang)
          for f in Configs/scripts/.local/bin/*; do
            if [ -f "$f" ] && head -1 "$f" | grep -q '#!/usr/bin/env nu'; then
              echo "Checking: $f"
              nu -c "nu-check '$f'"
            fi
          done

      - name: 🎨 format check (dprint)
        run: |
          dprint check --config Configs/dprint/dprint.json

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: 📥 checkout repository
        uses: actions/checkout@v4

      - name: 🔧 install nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: 📦 install nushell
        run: nix profile add nixpkgs#nushell

      - name: 🧪 run test suite
        run: |
          nu Configs/scripts/.local/bin/test_scripts

      - name: ✅ verify generate-machine-config (cross-platform)
        run: |
          nu Configs/scripts/.local/bin/generate-machine-config --output /tmp/test-machine.nix
          cat /tmp/test-machine.nix
          rm /tmp/test-machine.nix

  nix-check:
    name: nix flake check
    runs-on: ubuntu-latest
    steps:
      - name: 📥 checkout repository
        uses: actions/checkout@v4

      - name: 🔧 install nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: 📝 generate machine.nix for ci
        run: |
          nix profile add nixpkgs#nushell
          nu Configs/scripts/.local/bin/generate-machine-config \
            --output Configs/nix/.config/nix/machine.nix
          # git-add so Nix includes it when copying source to the store
          git add --force Configs/nix/.config/nix/machine.nix

      - name: 🔍 nix flake check
        run: |
          nix flake check ./Configs/nix/.config/nix --impure --no-build

  setup-test:
    name: setup script (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: 📥 checkout repository
        uses: actions/checkout@v4

      - name: 🔧 install nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: 🧪 run setup script
        run: ./setup --skip-nix --no-confirm

      - name: ✅ verify setup completed
        run: |
          command -v tuckr && echo "tuckr: ok"
          command -v nu && echo "nushell: ok"
          tuckr status

  docker-integration:
    name: docker integration test
    runs-on: ubuntu-latest
    steps:
      - name: 📥 checkout repository
        uses: actions/checkout@v4

      - name: 🏗️ build and run docker integration test
        run: docker build -t dotfiles-test .
