name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: 📥 checkout repository
        uses: actions/checkout@v4

      - name: 🧹 free disk space (macos)
        if: runner.os == 'macOS'
        run: |
          # Remove Xcode to free ~12GB (nix provides its own build tools)
          sudo rm -rf /Applications/Xcode_*.app
          # Remove simulators
          xcrun simctl delete all 2>/dev/null || true
          sudo rm -rf ~/Library/Developer/CoreSimulator
          df -h /

      - name: 🔧 install nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔧 set up nix cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: 🧪 run setup script
        run: ./setup --skip-nix --no-confirm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔍 shellcheck bash scripts
        run: |
          shellcheck setup setup-tuckr-symlink.sh Hooks/nix/post.sh Hooks/nushell/post.sh

      - name: 🔍 validate nushell scripts (nu-check)
        run: |
          # Check .nu module files
          for f in $(find . -name '*.nu' -not -path './.git/*'); do
            echo "Checking: $f"
            nu -c "nu-check --as-module '$f'"
          done

          # Check nushell scripts without .nu extension (have #!/usr/bin/env nu shebang)
          for f in Configs/scripts/.local/bin/*; do
            if [ -f "$f" ] && head -1 "$f" | grep -q '#!/usr/bin/env nu'; then
              echo "Checking: $f"
              nu -c "nu-check '$f'"
            fi
          done

      - name: 🎨 format check (dprint)
        run: |
          dprint check --config Configs/dprint/dprint.json

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: 📥 checkout repository
        uses: actions/checkout@v4

      - name: 🔧 install nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔧 set up nix cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: 📦 install nushell
        run: nix profile add nixpkgs#nushell

      - name: 🧪 run test suite
        run: |
          nu Configs/scripts/.local/bin/test_scripts

      - name: ✅ verify generate-machine-config (cross-platform)
        run: |
          nu Configs/scripts/.local/bin/generate-machine-config --output /tmp/test-machine.nix
          cat /tmp/test-machine.nix
          rm /tmp/test-machine.nix

  setup:
    name: setup script (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: 📥 checkout repository
        uses: actions/checkout@v4

      - name: 🧹 free disk space (macos)
        if: runner.os == 'macOS'
        run: |
          # Remove Xcode to free ~12GB (nix provides its own build tools)
          sudo rm -rf /Applications/Xcode_*.app
          # Remove simulators
          xcrun simctl delete all 2>/dev/null || true
          sudo rm -rf ~/Library/Developer/CoreSimulator
          df -h /

      - name: 🔧 install nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔧 set up nix cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: 🧪 run setup script
        run: ./setup --skip-nix --no-confirm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: ✅ verify setup completed
        run: |
          command -v tuckr && echo "tuckr: ok"
          command -v nu && echo "nushell: ok"
          tuckr status

  docker-integration:
    name: docker integration test
    runs-on: ubuntu-latest
    steps:
      - name: 📥 checkout repository
        uses: actions/checkout@v4

      - name: 🏗️ build and run docker integration test
        run: docker build -t dotfiles-test .
