name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: 📥 checkout repository
        uses: actions/checkout@v5

      - name: 🔧 install nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔧 set up nix cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: 📦 install lint tools
        run: |
          nix profile add nixpkgs#shellcheck nixpkgs#dprint nixpkgs#nushell \
            nixpkgs#shfmt nixpkgs#nixfmt nixpkgs#kdlfmt nixpkgs#nufmt \
            nixpkgs#racket-minimal
          raco pkg install --skip-installed --auto --scope user --no-docs fmt || true

      - name: 🔍 shellcheck bash scripts
        run: |
          shellcheck setup setup-tuckr-symlink.sh Hooks/nix/post.sh Hooks/nushell/post.sh Hooks/claude/post.sh \
            Configs/shell/.config/shell/env.sh Configs/bash/.bashrc

      - name: 🔍 validate nushell scripts (nu-check)
        run: |
          # Check .nu module files
          while IFS= read -r -d '' f; do
            echo "Checking: $f"
            nu -c "nu-check --as-module '$f'"
          done < <(find . -name '*.nu' -not -path './.git/*' -print0)

          # Check nushell scripts without .nu extension (have #!/usr/bin/env nu shebang)
          for f in Configs/scripts/.local/bin/*; do
            if [ -f "$f" ] && head -1 "$f" | grep -q '#!/usr/bin/env nu'; then
              echo "Checking: $f"
              nu -c "nu-check '$f'"
            fi
          done

      - name: 🎨 format check (dprint)
        run: |
          dprint check --config Configs/dprint/dprint.json

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: 📥 checkout repository
        uses: actions/checkout@v5

      - name: 🔧 install nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔧 set up nix cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: 📦 install nushell
        run: nix profile add nixpkgs#nushell

      - name: 🧪 run test suite
        run: |
          nu Configs/scripts/.local/bin/test_scripts

      - name: ✅ verify generate-machine-config (cross-platform)
        run: |
          nu Configs/scripts/.local/bin/generate-machine-config --output /tmp/test-machine.nix
          cat /tmp/test-machine.nix
          rm /tmp/test-machine.nix
