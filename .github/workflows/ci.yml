name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: 📥 checkout repository
        uses: actions/checkout@v5

      - name: 🔧 install nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔧 set up nix cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: 📦 install lint tools
        run: |
          nix profile add nixpkgs#shellcheck nixpkgs#dprint nixpkgs#nushell \
            nixpkgs#shfmt nixpkgs#nixfmt nixpkgs#kdlfmt nixpkgs#nufmt nixpkgs#taplo \
            nixpkgs#racket
          # Add nix profile to GITHUB_PATH for subsequent steps
          echo "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"
          # Force install newer pretty-expressive to override the one bundled with racket
          raco pkg install --auto --scope user --no-docs --force pretty-expressive
          # Now install fmt
          raco pkg install --auto --scope user --no-docs fmt
          # Verify raco fmt works
          raco fmt --help

      - name: 🔍 shellcheck bash scripts
        run: |
          shellcheck setup setup-tuckr-symlink.sh Hooks/nix/post.sh Hooks/nushell/post.sh Hooks/pnpm/post.sh \
            Configs/shell/.config/shell/env.sh Configs/bash/.bashrc \
            Configs/scripts/.local/bin/setup:dotfiles Configs/scripts/.local/bin/uninstall:dotfiles Configs/scripts/.local/bin/reset:dotfiles tests/setup-uninstall-reset-test.sh

      - name: 🔍 validate nushell scripts (nu-check)
        run: |
          # Check .nu module files
          while IFS= read -r -d '' f; do
            echo "Checking: $f"
            nu -c "nu-check --as-module '$f'"
          done < <(find . -name '*.nu' -not -path './.git/*' -print0)

          # Check nushell scripts without .nu extension (have #!/usr/bin/env nu shebang)
          for f in Configs/scripts/.local/bin/*; do
            if [ -f "$f" ] && head -1 "$f" | grep -q '#!/usr/bin/env nu'; then
              echo "Checking: $f"
              nu -c "nu-check '$f'"
            fi
          done

      - name: 🦕 install deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: 🔍 type check CLI (deno check)
        run: |
          cd cli && deno task check

      - name: 🔍 lint CLI (oxlint + deno lint)
        run: |
          cd cli && deno task lint

      - name: 🎨 format check CLI (deno fmt)
        run: |
          cd cli && deno task fmt:check

      - name: 🏗️ compile CLI binary (deno compile)
        run: |
          cd cli && deno task compile:dev
          ./dotfiles --help
          rm dotfiles

      - name: 🎨 format check (dprint)
        run: |
          dprint check --config Configs/dprint/dprint.json

      - name: ✅ docs consistency check
        run: |
          tests/check-docs-consistency.sh

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: 📥 checkout repository
        uses: actions/checkout@v5

      - name: 🔧 install nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔧 set up nix cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: 📦 install nushell
        run: |
          # The flake lives under Configs/nix/.config/nix, not the repo root.
          # Use the repo flake package so CI gets the same nushell workaround
          # as local setup/bootstrap.
          nix profile add ./Configs/nix/.config/nix#ci-nushell

      - name: 🧪 run test suite
        run: |
          nu Configs/scripts/.local/bin/test_scripts

      - name: ✅ verify generate-machine-config (cross-platform)
        run: |
          nu Configs/scripts/.local/bin/generate-machine-config --output /tmp/test-machine.nix
          cat /tmp/test-machine.nix
          rm /tmp/test-machine.nix

      - name: 🔧 verify setup/uninstall/reset scripts
        run: |
          echo "--- Testing setup:dotfiles --help ---"
          Configs/scripts/.local/bin/setup:dotfiles --help
          echo ""
          echo "--- Testing uninstall:dotfiles --help ---"
          Configs/scripts/.local/bin/uninstall:dotfiles --help
          echo ""
          echo "--- Testing reset:dotfiles script exists and is executable ---"
          test -x Configs/scripts/.local/bin/reset:dotfiles && echo "reset:dotfiles is executable"
          echo ""
          echo "--- Testing setup:dotfiles --dry-run (lite mode) ---"
          Configs/scripts/.local/bin/setup:dotfiles --dry-run --lite --no-confirm
          echo ""
          echo "--- Testing setup:dotfiles --list-groups ---"
          Configs/scripts/.local/bin/setup:dotfiles --list-groups
          echo ""
          echo "All script verification tests passed!"
