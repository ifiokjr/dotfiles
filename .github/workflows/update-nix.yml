name: update nix

on:
  schedule:
    # Run daily at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-nix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    name: update flake lock
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to commit the updated flake.lock.
      pull-requests: write # Required to open the automated pull request.
    steps:
      - name: 📥 checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: 🔧 install nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔄 update flake lock
        run: nix flake update --flake ./Configs/nix/.config/nix
        env:
          NIX_CONFIG: access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: ✅ validate flake
        run: nix flake check --flake ./Configs/nix/.config/nix --impure --no-build
        env:
          NIX_CONFIG: access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: 📝 generate commit summary
        id: summary
        run: |
          {
            echo 'body<<EOFBODY'
            echo "## Summary"
            echo ""
            echo "Automated daily update of Nix flake inputs via nix flake update."
            echo ""
            if ! git diff --quiet Configs/nix/.config/nix/flake.lock; then
              echo "### Flake input changes"
              echo ""
              echo '```diff'
              git diff Configs/nix/.config/nix/flake.lock | head -200
              echo '```'
              echo ""
            fi
            echo "## Test plan"
            echo ""
            echo "- [x] Ran nix flake update --flake ./Configs/nix/.config/nix"
            echo "- [x] Verified flake.lock diff"
            echo 'EOFBODY'
          } >> "$GITHUB_OUTPUT"

      - name: 🤖 create pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: Configs/nix/.config/nix/flake.lock
          commit-message: "chore(nix): update flake lock"
          branch: chore/nix-auto-update
          delete-branch: true
          title: "chore(nix): update flake lock"
          body: ${{ steps.summary.outputs.body }}
          labels: automated,nix
