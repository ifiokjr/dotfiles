# Agent model routing policy and usage-aware fallback chains.
#
# Deployed to `~/.config/agents/models.toml` and read by `dot models`.
# Keep AGENTS.md focused on durable rules; update model IDs, tiers, or
# thresholds here instead of churning global agent instructions.
#
# Optional machine-local overrides live in `~/.config/agents/models.local.toml`
# (untracked). Any `[thresholds]`, `disabled_providers`, `[council]`, or
# `[tiers.<name>]` entries there override this file on that machine.

[thresholds]
# Prefer the next healthy candidate once any governed window hits this percent.
low_percent = 80
# Skip a candidate completely once any governed window hits this percent.
exhausted_percent = 95
# Flag cached T3 Code usage snapshots older than this many minutes.
stale_minutes = 60

[bans]
# Permanently banned across every harness, thread, subagent, and fallback.
models = [
	"opencode-go/deepseek-v4-pro",
	"opencode/deepseek-v4-pro",
	"ollama-cloud/deepseek-v4-pro",
	"ollama-cloud/deepseek-v4-pro:0813",
	"ollama/deepseek-v4-pro:cloud",
]
# Expensive models that require an explicit request in the current thread.
explicit_only = [
	"gpt-6-astra",
	"gpt-6.2-astra",
	"gpt-5.6-cyber",
	"gpt-5.5-pro",
	"claude-fable-5-1",
	"claude-fable-5-2",
]

[council]
description = "Tri-provider review council (one frontier model per provider, high effort)"

[[council.members]]
provider = "antigravity"
model = "gemini-4-neon"
usage_windows = ["gemini-5h", "gemini-weekly"]
note = "Google Ultra frontier peer to Opus 5.5"

[council.members.options]
thought_level = "high"

[[council.members]]
provider = "claudeAgent"
model = "claude-opus-5-5"
usage_windows = ["seven_day"]
note = "Anthropic frontier reviewer"

[council.members.options]
effort = "high"

[[council.members]]
provider = "codex"
model = "gpt-6.2-sol"
usage_windows = ["primary"]
note = "OpenAI frontier adversarial reviewer (sol-loop)"

[council.members.options]
reasoningEffort = "high"

