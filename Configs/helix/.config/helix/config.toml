[keys.normal.ret.b]
## Close the current buffer only if saved.
c = ":buffer-close"
## Close the current buffer even if unsaved.
C = ":buffer-close!"
## Close all saved buffers.
a = ":buffer-close-all"
## Force close all buffers.
A = ":buffer-close-all!"
## Close all other buffers.
o = ":buffer-close-others"
## Force close all other buffers.
O = ":buffer-close-others!"
## Save buffers before closing
w = { c = ":write-buffer-close", C = ":write-buffer-close!" }
q = { c = ":quit", C = ":quit!", a = ":quit-all", A = ":quit-all!" }

[keys.select.ret.b]
## Close the current buffer only if saved.
c = ":buffer-close"
## Close the current buffer even if unsaved.
C = ":buffer-close!"
## Close all saved buffers.
a = ":buffer-close-all"
## Force close all buffers.
A = ":buffer-close-all!"
## Close all other buffers.
o = ":buffer-close-others"
## Force close all other buffers.
O = ":buffer-close-others!"
## Save buffers before closing
w = { c = ":write-buffer-close", C = ":write-buffer-close!" }
q = { c = ":quit", C = ":quit!", a = ":quit-all", A = ":quit-all!" }

[keys.normal.ret.q]
## Quit the current window only if saved.
c = ":quit"
## Quit the current buffer even if unsaved.
C = ":quit!"
## Quit all saved buffers.
a = ":quit-all"
## Force close all buffers.
A = ":quit-all!"
