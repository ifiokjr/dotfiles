# Codex Custom Providers Configuration
# Appended to ~/.codex/config.toml by setup-codex.sh
#
# Ollama is built-in to Codex (--local-provider ollama or --oss).
# Only Xiaomi MiMo and Ollama Cloud need custom provider definitions.
#
# Usage:
#   codex --profile mimo            # Xiaomi MiMo-V2.5-Pro
#   codex --profile mimo-flash      # Xiaomi MiMo-V2-Flash
#   codex --profile ollama-gemma4   # Local Gemma4 26B
#   codex --profile ollama-deepseek # Local DeepSeek R1
#   codex --profile cloud-kimi      # Kimi K2.5 via Ollama Cloud
#
# API keys are normally injected from 1Password with `ssr codex`.
# ~/.codex/secrets.env remains an optional untracked fallback.

# ============================================================================
# Custom Providers
# ============================================================================

[model_providers.xiaomi]
name = "Xiaomi MiMo"
base_url = "https://api.xiaomimimo.com/v1"
env_key = "XIAOMI_MIMO_API_KEY"

[model_providers.ollama-cloud]
name = "Ollama Cloud"
base_url = "https://api.ollama.com/v1"
env_key = "OLLAMA_CLOUD_API_KEY"

# ============================================================================
# Profiles
# ============================================================================

# Xiaomi MiMo models
[profiles.mimo]
model_provider = "xiaomi"
model = "mimo-v2.5-pro"

[profiles.mimo-flash]
model_provider = "xiaomi"
model = "mimo-v2-flash"

[profiles.mimo-omni]
model_provider = "xiaomi"
model = "mimo-v2.5"

# Local Ollama models
[profiles.ollama-gemma4]
model_provider = "ollama"
model = "gemma4:26b"

[profiles.ollama-deepseek]
model_provider = "ollama"
model = "deepseek-r1:latest"

[profiles.ollama-gemma3]
model_provider = "ollama"
model = "gemma3:27b"

# Ollama Cloud models
[profiles.cloud-kimi]
model_provider = "ollama-cloud"
model = "kimi-k2.5"

[profiles.cloud-glm]
model_provider = "ollama-cloud"
model = "glm-5.1"
