# Codex Custom Providers Configuration
# This file defines additional model providers for Codex
# See: https://openai-codex.mintlify.app/configuration/custom-providers
#
# Usage:
#   codex --profile xiaomi     # Xiaomi MiMo-V2.5-Pro
#   codex --profile ollama     # Local Ollama models
#   codex --profile cloud      # Ollama Cloud models
#
# API keys are loaded from ~/.codex/secrets.env (not tracked in git)

# ============================================================================
# Custom Providers
# ============================================================================

# Xiaomi MiMo - Chinese AI models with strong reasoning capabilities
[model_providers.xiaomi]
name = "Xiaomi MiMo"
base_url = "https://api.xiaomimimo.com/v1"
env_key = "XIAOMI_MIMO_API_KEY"

# Ollama Local - Run models locally on your machine
[model_providers.ollama]
name = "Ollama (Local)"
base_url = "http://localhost:11434/v1"
env_key = "OLLAMA_API_KEY"

# Ollama Cloud - Access to cloud-hosted open models
[model_providers.ollama-cloud]
name = "Ollama Cloud"
base_url = "https://api.ollama.com/v1"
env_key = "OLLAMA_CLOUD_API_KEY"

# ============================================================================
# Profiles for easy model switching
# ============================================================================

[profiles.xiaomi]
model_provider = "xiaomi"
model = "mimo-v2.5-pro"

[profiles.ollama]
model_provider = "ollama"
model = "gemma4:26b"

[profiles.cloud]
model_provider = "ollama-cloud"
model = "kimi-k2.5"

[profiles.gemma4]
model_provider = "ollama"
model = "gemma4:latest"

[profiles.deepseek]
model_provider = "ollama"
model = "deepseek-r1:latest"

[profiles.gemma3]
model_provider = "ollama"
model = "gemma3:27b"
