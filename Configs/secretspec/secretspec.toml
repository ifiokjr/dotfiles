[project]
name = "dotfiles"
revision = "1.0"

# ── Providers ──
[providers]
keyring = "keyring://"
op-interactive = "onepassword://Development"

[providers.dotfiles]
uri = "onepassword+token://Development/dotfiles"
[[providers.dotfiles.depends_on]]
secret = "OP_SERVICE_ACCOUNT_TOKEN"

# ── Profile defaults ──
[profiles.default.defaults]
providers = ["dotfiles"]
required = true

# ── Secrets ──
# All secrets live in the shared "dotfiles" item (Development vault).
# path = section name, key defaults to the SecretSpec name.

[profiles.default]
OP_SERVICE_ACCOUNT_TOKEN.description = "1Password service account token for automated access"
OP_SERVICE_ACCOUNT_TOKEN.providers = ["keyring", "op-interactive"]

# ── GitHub ──
GITHUB_TOKEN.description = "GitHub personal access token for gh CLI and API access"
GITHUB_TOKEN.providers = [{ provider = "dotfiles", path = ["GitHub"] }]

# ── AI / LLM ──
ANTHROPIC_API_KEY.description = "Anthropic API key for Claude (pi, opencode, etc.)"
ANTHROPIC_API_KEY.providers = [{ provider = "dotfiles", path = ["AI"] }]
OPENAI_API_KEY.description = "OpenAI API key for GPT models and Codex"
OPENAI_API_KEY.providers = [{ provider = "dotfiles", path = ["AI"] }]
GOOGLE_API_KEY.description = "Google Gemini API key"
GOOGLE_API_KEY.providers = [{ provider = "dotfiles", path = ["AI"] }]
GROQ_API_KEY.description = "Groq API key for fast inference"
GROQ_API_KEY.providers = [{ provider = "dotfiles", path = ["AI"] }]
OLLAMA_TOKEN.description = "Ollama API token"
OLLAMA_TOKEN.providers = [{ provider = "dotfiles", path = ["AI"] }]
REPLICATE_API_TOKEN.description = "Replicate API token for model inference"
REPLICATE_API_TOKEN.providers = [{ provider = "dotfiles", path = ["AI"] }]
HUGGING_FACE_TOKEN.description = "HuggingFace API token for model access"
HUGGING_FACE_TOKEN.providers = [{ provider = "dotfiles", path = ["AI"] }]

# ── Infrastructure ──
PULUMI_TOKEN.description = "Pulumi access token for infrastructure management"
PULUMI_TOKEN.providers = [{ provider = "dotfiles", path = ["Infra"] }]
CLOUDFLARE_API_TOKEN.description = "Cloudflare API token for Workers, Pages, DNS"
CLOUDFLARE_API_TOKEN.providers = [{ provider = "dotfiles", path = ["Infra"] }]

# ── Package Registries ──
NPM_TOKEN.description = "npm registry publish token"
NPM_TOKEN.providers = [{ provider = "dotfiles", path = ["Registries"] }]
FLAKEHUB_TOKEN.description = "FlakeHub token for Nix flake publishing"
FLAKEHUB_TOKEN.providers = [{ provider = "dotfiles", path = ["Registries"] }]

# ── Discord ──
DISCORD_TOKEN.description = "Discord bot token"
DISCORD_TOKEN.providers = [{ provider = "dotfiles", path = ["Other"] }]
DISCORD_CLIENT_ID.description = "Discord application client ID"
DISCORD_CLIENT_ID.providers = [{ provider = "dotfiles", path = ["Other"] }]
DISCORD_CLIENT_SECRET.description = "Discord application client secret"
DISCORD_CLIENT_SECRET.providers = [{ provider = "dotfiles", path = ["Other"] }]
