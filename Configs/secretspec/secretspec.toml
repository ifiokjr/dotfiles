[project]
name = "dotfiles"
revision = "1.0"

# ── Providers ──
[providers]
keyring = "keyring://"
op-interactive = "onepassword://Development"
dotfiles = { uri = "onepassword+token://Development/dotfiles", depends_on = [
  { secret = "OP_SERVICE_ACCOUNT_TOKEN" },
] }


# ── Profile defaults ──
[profiles.default.defaults]
providers = ["dotfiles"]
required = true

# ── Secrets ──
# All secrets live in the shared "dotfiles" item (Development vault).
# path = section name, key defaults to the SecretSpec name.

[profiles.default.OP_SERVICE_ACCOUNT_TOKEN]
description = "1Password service account token for automated access"
providers = ["keyring", "op-interactive"]

[profiles.default.GITHUB_TOKEN]
description = "GitHub personal access token for gh CLI and API access"
providers = [{ provider = "dotfiles", path = ["forges"] }]

[profiles.default.ANTHROPIC_API_KEY]
description = "Anthropic API key for Claude (pi, opencode, etc.)"
providers = [{ provider = "dotfiles", path = ["ai"] }]

[profiles.default.OPENAI_API_KEY]
description = "OpenAI API key for GPT models and Codex"
providers = [{ provider = "dotfiles", path = ["ai"] }]

[profiles.default.GOOGLE_API_KEY]
description = "Google Gemini API key"
providers = [{ provider = "dotfiles", path = ["ai"] }]

[profiles.default.GROQ_API_KEY]
description = "Groq API key for fast inference"
providers = [{ provider = "dotfiles", path = ["ai"] }]

[profiles.default.OLLAMA_TOKEN]
description = "Ollama API token"
providers = [{ provider = "dotfiles", path = ["ai"] }]

[profiles.default.REPLICATE_API_TOKEN]
description = "Replicate API token for model inference"
